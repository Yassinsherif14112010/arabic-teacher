name: arabic_teacher_flutter
description: "منصة الشاعر في اللغة العربية - تطبيق Flutter أوفلاين للأجهزة اللوحية"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local persistence — no server required
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Supabase & Enterprise Security
  supabase_flutter: ^2.5.5
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  flutter_animate: ^4.5.0

  # Barcode generation (offline, no network)
  barcode_widget: ^2.0.4

  # Date/number formatting
  intl: 0.20.2

  # Preferences (theme, teacher name)
  shared_preferences: ^2.3.2

  # Icons & core utilities (explicit for clean cloud/FlutLab resolution)
  cupertino_icons: ^1.0.8
  async: ^2.11.0
  connectivity_plus: ^7.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
