name: arabic_teacher_flutter
description: "منصة الشاعر في اللغة العربية - تطبيق Flutter أوفلاين للأجهزة اللوحية"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local persistence — no server required
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Barcode generation (offline, no network)
  barcode_widget: ^2.0.4

  # Date/number formatting
  intl: ^0.19.0

  # Preferences (theme, teacher name)
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
